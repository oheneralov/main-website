[mypy]
# Ignore missing imports for third-party packages without type stubs
ignore_missing_imports = True

# Strict mode settings
strict = False
no_implicit_optional = True

# Per-module options
[mypy-chromadb.*]
ignore_missing_imports = True

[mypy-langchain.*]
ignore_missing_imports = True

[mypy-torch.*]
ignore_missing_imports = True

[mypy-transformers.*]
ignore_missing_imports = True
