# AWS Info Website - Helm Values
# Default configuration for mainwebsite Helm chart

# Global configuration
global:
  labels: {}
  annotations: {}

# Main Website Service Configuration
mainwebsite:
  enabled: true
  replicaCount: 1
  
  image:
    repository: 473587278533.dkr.ecr.us-east-1.amazonaws.com/mainwebsite
    pullPolicy: IfNotPresent
    tag: "latest"
  
  service:
    type: ClusterIP
    port: 80
    targetPort: 8080
  
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
  
  probes:
    liveness:
      httpGet:
        path: /
        port: http
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    
    readiness:
      httpGet:
        path: /
        port: http
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3
  
  env: []
  
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
  
  nodeSelector: {}
  affinity: {}
  tolerations: []

# Service Account
serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

# Pod Security Context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

# Container Security Context
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    add:
      - NET_BIND_SERVICE
    drop:
      - ALL
  readOnlyRootFilesystem: true

# Ingress Configuration (using Traefik IngressRoute)
ingress:
  enabled: true
  className: traefik
  
  mainwebsite:
    hostname: oleksandrgeneralov.com
    entrypoint: web
    middlewares: []

# Image Pull Secrets
imagePullSecrets: []

# Pod Annotations
podAnnotations: {}

# Pod Labels
podLabels: {}

# Monitoring/Prometheus
monitoring:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 30s
    path: /metrics
    labels: {}
  
  prometheus:
    enabled: true
    interval: 30s

# RBAC
rbac:
  create: true
  
# Volume mounts
volumes:
  - name: nginx-cache
    emptyDir: {}
  - name: nginx-run
    emptyDir: {}
volumeMounts:
  - name: nginx-cache
    mountPath: /var/cache/nginx
  - name: nginx-run
    mountPath: /run

