# Staging Environment Values
# Used for staging deployments: helm install -f values-staging.yaml
# Override the base values.yaml for staging-specific configurations

global:
  namespace: staging
  labels:
    environment: staging

mainwebsite:
  replicaCount: 2
  
  image:
    tag: "staging-latest"
    pullPolicy: IfNotPresent
  
  resources:
    limits:
      cpu: 400m
      memory: 384Mi
    requests:
      cpu: 200m
      memory: 192Mi
  
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 75
    targetMemoryUtilizationPercentage: 75

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

ingress:
  enabled: true
  mainwebsite:
    hostname: staging.oleksandrgeneralov.com

monitoring:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 30s
